<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <!-- Star twinkle filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="thrustglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="900" height="120" fill="#020817"/>

  <!-- Stars - static small -->
  <circle cx="30"  cy="10" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="80"  cy="50" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="150" cy="15" r="1"   fill="white" opacity="0.7"/>
  <circle cx="200" cy="70" r="0.7" fill="white" opacity="0.4"/>
  <circle cx="270" cy="30" r="0.9" fill="white" opacity="0.6"/>
  <circle cx="340" cy="90" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="400" cy="20" r="1"   fill="white" opacity="0.7"/>
  <circle cx="460" cy="60" r="0.7" fill="white" opacity="0.4"/>
  <circle cx="530" cy="10" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="590" cy="80" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="650" cy="35" r="1"   fill="white" opacity="0.7"/>
  <circle cx="710" cy="55" r="0.7" fill="white" opacity="0.4"/>
  <circle cx="780" cy="15" r="0.9" fill="white" opacity="0.6"/>
  <circle cx="840" cy="75" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="870" cy="40" r="1"   fill="white" opacity="0.7"/>
  <circle cx="50"  cy="90" r="0.8" fill="#38bdf8" opacity="0.5"/>
  <circle cx="120" cy="45" r="0.6" fill="#a78bfa" opacity="0.5"/>
  <circle cx="320" cy="15" r="0.7" fill="#38bdf8" opacity="0.5"/>
  <circle cx="500" cy="95" r="0.8" fill="#a78bfa" opacity="0.5"/>
  <circle cx="720" cy="20" r="0.6" fill="#38bdf8" opacity="0.5"/>
  <circle cx="860" cy="95" r="0.9" fill="#a78bfa" opacity="0.5"/>

  <!-- Twinkling stars (animated opacity) -->
  <circle cx="100" cy="25" r="1.2" fill="white">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="85" r="1.1" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="50" r="1.3" fill="white">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="30" r="1.0" fill="#a78bfa">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="100" r="1.1" fill="white">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" repeatCount="indefinite"/>
  </circle>

  <!-- Planet (right side, static) -->
  <circle cx="830" cy="60" r="30" fill="#1e3a5f" opacity="0.85"/>
  <circle cx="830" cy="60" r="30" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.4"/>
  <!-- Planet surface bands -->
  <ellipse cx="830" cy="52" rx="28" ry="5" fill="#164e7a" opacity="0.5"/>
  <ellipse cx="830" cy="65" rx="25" ry="4" fill="#164e7a" opacity="0.4"/>
  <!-- Planet ring -->
  <ellipse cx="830" cy="60" rx="44" ry="9" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>

  <!-- Small moon -->
  <circle cx="770" cy="30" r="6" fill="#334155" opacity="0.9"/>
  <circle cx="768" cy="28" r="1.2" fill="#475569" opacity="0.6"/>

  <!-- ══════════════════════════════════════════
       SPACECRAFT GROUP — animated across screen
       Path: starts off-screen left, flies right,
       dips slightly in middle, exits right, then
       loops back from right off-screen.
  ═══════════════════════════════════════════ -->
  <g id="spacecraft">
    <!-- Thrust flame / exhaust (left side of ship) -->
    <g filter="url(#thrustglow)">
      <!-- Outer flame -->
      <polygon points="-22,0 -38,5 -38,-5" fill="#f97316" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.4;0.9;0.5;0.85" dur="0.18s" repeatCount="indefinite"/>
        <animate attributeName="points" values="-22,0 -38,5 -38,-5; -22,0 -44,7 -44,-7; -22,0 -36,4 -36,-4; -22,0 -42,6 -42,-6; -22,0 -38,5 -38,-5" dur="0.18s" repeatCount="indefinite"/>
      </polygon>
      <!-- Inner flame -->
      <polygon points="-22,0 -32,3 -32,-3" fill="#fef08a" opacity="0.95">
        <animate attributeName="opacity" values="0.95;0.6;1;0.7;0.95" dur="0.12s" repeatCount="indefinite"/>
        <animate attributeName="points" values="-22,0 -32,3 -32,-3; -22,0 -36,4 -36,-4; -22,0 -30,2 -30,-2; -22,0 -34,3 -34,-3; -22,0 -32,3 -32,-3" dur="0.12s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Main fuselage -->
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="#94a3b8"/>
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="url(#hullgrad)" />
    <!-- Hull highlight -->
    <ellipse cx="0" cy="-3" rx="18" ry="3.5" fill="white" opacity="0.15"/>

    <!-- Nose cone -->
    <polygon points="22,0 12,6 12,-6" fill="#38bdf8"/>
    <polygon points="22,0 14,3 14,-3" fill="#7dd3fc" opacity="0.6"/>

    <!-- Cockpit window -->
    <ellipse cx="8" cy="0" rx="5" ry="4" fill="#0ea5e9" opacity="0.9"/>
    <ellipse cx="7" cy="-1" rx="2.5" ry="2" fill="white" opacity="0.3"/>

    <!-- Top wing -->
    <polygon points="-5,-8 10,-8 5,-18 -8,-18" fill="#64748b"/>
    <polygon points="-5,-8 10,-8 5,-18 -8,-18" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.5"/>
    <!-- Bottom wing -->
    <polygon points="-5,8 10,8 5,18 -8,18" fill="#64748b"/>
    <polygon points="-5,8 10,8 5,18 -8,18" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.5"/>

    <!-- Engine nacelle top -->
    <ellipse cx="-8" cy="-12" rx="6" ry="3" fill="#475569"/>
    <!-- Engine nacelle bottom -->
    <ellipse cx="-8" cy="12" rx="6" ry="3" fill="#475569"/>

    <!-- Tail fin -->
    <polygon points="-18,-8 -22,-8 -18,0" fill="#94a3b8"/>
    <polygon points="-18,8 -22,8 -18,0" fill="#94a3b8"/>

    <!-- Running lights -->
    <circle cx="10" cy="-7" r="1.5" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="10" cy="7" r="1.5" fill="#f87171">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Animate spacecraft across screen: left→right, gentle sine-wave vertical drift -->
    <animateMotion
      dur="7s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.45;0.55;1"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
      path="M-60,60 C200,20 600,90 960,50 C980,48 980,48 960,48 C600,90 200,20 -60,60"
    />
    <!-- Gentle rock/tilt -->
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0;-6;3;-4;2;-5;0"
      keyTimes="0;0.15;0.35;0.55;0.7;0.85;1"
      dur="7s"
      repeatCount="indefinite"
      additive="sum"
    />
  </g>

</svg>
